name: Validate GH-AW workflows
on:
  pull_request:
    paths:
      - '.github/workflows/ghaw-issue-triage.md'
      - '.github/workflows/ghaw-issue-triage.lock.yml'
      - '.github/workflows/ghaw-nightly-quality.md'
      - '.github/workflows/ghaw-nightly-quality.lock.yml'
      - '.github/workflows/ghaw-pr-review.md'
      - '.github/workflows/ghaw-pr-review.lock.yml'
      - '.github/workflows/gh-aw-compile.yml'
      - '.github/aw/actions-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up gh-aw CLI
        uses: github/gh-aw-actions/setup-cli@5c2fe865bb4dc46e1450f6ee0d0541d759aea73a # v0.79.6
        with:
          version: v1.2.2
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile GH-AW source workflows
        run: gh aw compile ghaw-issue-triage ghaw-nightly-quality ghaw-pr-review --no-check-update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require reviewed lock files to match their sources
        run: git diff --exit-code -- .github/workflows/ghaw-issue-triage.lock.yml .github/workflows/ghaw-nightly-quality.lock.yml .github/workflows/ghaw-pr-review.lock.yml .github/aw/actions-lock.json
